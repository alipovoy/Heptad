name: PR Conventions

# Why this check exists: readable history.
#
# The usual argument for enforcing Conventional Commits is that a release tool
# reads the subjects to generate release notes and suggest the next version.
# That does not apply to Heptad — it is source only, with no releases, no tags
# and no version anywhere — so nothing downstream consumes these subjects. The
# reason is simpler: this repository is published for people to read, and `git
# log` and the pull request list are among the first things they read. A
# uniformly shaped subject line makes both scannable.
#
# It applies to new pull requests only. Existing history predates the convention
# and is not being rewritten, so the commit-subjects job validates the commits in
# the pull request and never touches the rest of the branch.
#
# No third-party actions and no commitlint: the rule is small enough that a
# readable script beats adding a supply-chain dependency to a repository that
# currently has none. The validator lives in
# .github/scripts/check-conventional-subjects.py and is shared by both jobs.

on:
  pull_request:
    # `edited` is what makes the title job usable: a title corrected after the
    # fact has to re-run the check, and `edited` fires on title changes.
    # `synchronize` re-runs both jobs when commits are pushed.
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

# One run per pull request; a re-title or a new push supersedes the run in
# flight. Keyed on the pull request rather than the ref, since `github.ref` for a
# `pull_request` event is the merge ref and the title can change without it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Two jobs rather than one, so either can be made a required status check on its
# own: the title is the maintainer's to fix, the commit subjects are the
# contributor's, and mixing them into one check means neither can be required
# without the other.
jobs:
  pr-title:
    name: Pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # The title goes through env, never through ${{ }} inside the script body:
      # it is attacker-controlled text and would otherwise be interpolated into
      # the shell before the shell ever sees it as data.
      - name: Check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          printf 'PR title\t%s\n' "$PR_TITLE" |
            python3 .github/scripts/check-conventional-subjects.py

  commit-subjects:
    name: Commit subjects
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      # For the pull request commits endpoint below.
      pull-requests: read

    steps:
      # Shallow: this job reads the validator out of the tree and gets the
      # commits from the API, so it needs no history at all.
      - name: Check out source
        uses: actions/checkout@v7

      # The commits come from the API rather than from git, on purpose. Doing
      # this with git means fetching history and listing `base..head`, which has
      # two failure modes:
      #
      #   * A `pull_request` checkout is shallow, so the base commit is simply
      #     not in the clone and `git log` fails. Fixing that needs
      #     fetch-depth: 0, i.e. the whole history, to read a handful of
      #     subjects.
      #   * `pull_request.base.sha` is the tip of the base branch at event time,
      #     not the branch point. As soon as `main` moves ahead of where the
      #     branch was cut, `base.sha..head.sha` includes commits that came from
      #     `main` — other people's already-merged commits, which this check has
      #     no business failing on. Getting that right needs an explicit
      #     `git merge-base`.
      #
      # `pulls/{number}/commits` returns exactly the commits the pull request
      # adds, so neither problem exists and nothing has to be fetched.
      #
      # Merge commits are dropped: their subjects are generated by GitHub or by
      # `git merge` and are not the contributor's to shape. @tsv escapes tabs
      # and newlines inside a subject, so one commit stays one line.
      - name: Collect commit subjects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            --jq '.[]
                  | select(.parents | length == 1)
                  | [.sha[0:8], (.commit.message | split("\n")[0])]
                  | @tsv' > "${RUNNER_TEMP}/subjects.tsv"
          cat "${RUNNER_TEMP}/subjects.tsv"

      - name: Check subjects
        run: |
          set -euo pipefail
          subjects="${RUNNER_TEMP}/subjects.tsv"
          # A pull request of nothing but merge commits has no subject of its own
          # to check. Vacuously fine, and not a reason to fail.
          if [ ! -s "$subjects" ]; then
            echo "::notice::No non-merge commits in this pull request; nothing to check."
            exit 0
          fi
          # The endpoint tops out at 250 commits. Far beyond anything this
          # repository will see, but a silent pass would be the wrong failure.
          if [ "$(wc -l < "$subjects")" -ge 250 ]; then
            echo "::warning::Only the first 250 commits of this pull request were checked."
          fi
          python3 .github/scripts/check-conventional-subjects.py < "$subjects"
